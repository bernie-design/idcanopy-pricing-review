<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDCanopy Pricing Cockpit</title>
<style>
:root {
  /* IDCanopy — teal-primary / purple-secondary */
  --bg: #f4faf9;
  --panel: #ffffff;
  --border: #cde8e5;
  --text: #1a2e2c;
  --muted: #5d7c79;
  --accent: #0d9488;
  --accent-soft: #ccfbf1;
  --accent-hover: #0f766e;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --amber: #d97706;
  --amber-soft: #fef3c7;
  --red: #dc2626;
  --red-soft: #fee2e2;
  --premium: #7c3aed;
  --premium-soft: #ede9fe;
  --block-a-bg: #f0fdfa;
  --block-a-border: #99f6e4;
  --block-a-text: #0f5c57;
  --block-a-chip-active: #0d9488;
  --block-a-chip-active-text: #ccfbf1;
  --block-b-bg: #fefce8;
  --block-b-border: #fde68a;
  --block-b-text: #92400e;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 1px 1px rgba(0,0,0,.03);
}
:root[data-theme="dark"] {
  --bg: #0e1917;
  --panel: #162321;
  --border: #1e3633;
  --text: #e2f5f3;
  --muted: #6b9e9a;
  --accent: #2dd4bf;
  --accent-soft: #0d2e2b;
  --accent-hover: #14b8a6;
  --green: #4ade80;
  --green-soft: #052e16;
  --amber: #fbbf24;
  --amber-soft: #1c1200;
  --red: #f87171;
  --red-soft: #1f0808;
  --premium: #a78bfa;
  --premium-soft: #1e0a45;
  --block-a-bg: #0d2421;
  --block-a-border: #1a4540;
  --block-a-text: #5eead4;
  --block-a-chip-active: #0f766e;
  --block-a-chip-active-text: #ccfbf1;
  --block-b-bg: #1a1600;
  --block-b-border: #3d3000;
  --block-b-text: #fbbf24;
  --shadow: 0 1px 4px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 14px/1.45 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
header {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
}
.tabs {
  display: flex;
  gap: 4px;
  padding: 8px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 61px;
  z-index: 10;
}
.tab {
  padding: 7px 12px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  cursor: pointer;
}
.tab.active { color: var(--accent); background: var(--accent-soft); border-color: var(--block-a-border); font-weight: 600; }
.view { display: none; padding: 16px 24px 32px; }
.view.active { display: block; }
.catalog-head { display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.catalog-head h2 { margin:0; font-size:18px; }
.catalog-head input { min-width:280px; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font:inherit; }
.catalog-table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); }
.catalog-table th, .catalog-table td { padding:8px 10px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; font-size:12.5px; }
.catalog-table th { position:sticky; top:106px; background:var(--bg); color:var(--muted); font-weight:600; z-index:2; }
.catalog-table input, .catalog-table select { width:100%; min-width:100px; padding:5px 6px; border:1px solid var(--border); border-radius:5px; font:inherit; }
.catalog-table .money { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.catalog-table .desc { max-width:440px; color:var(--muted); }
.catalog-table .save-row { padding:5px 9px; border:1px solid var(--accent); color:var(--accent); background:var(--accent-soft); border-radius:5px; cursor:pointer; }
.catalog-table .add-row { padding:5px 9px; border:1px solid var(--green); color:var(--green); background:var(--green-soft); border-radius:5px; cursor:pointer; white-space:nowrap; }
.catalog-table .add-row.selected { color:#fff; background:var(--green); }
.selector-bundles { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
.selector-bundle { padding:7px 10px; border:1px solid var(--accent); border-radius:6px; background:var(--accent-soft); color:var(--accent); cursor:pointer; }
.selector-summary {
  position:sticky; bottom:12px; z-index:5; margin-top:12px; padding:10px 12px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  border:1px solid var(--accent-soft); border-radius:8px; background:var(--panel);
  box-shadow:0 4px 18px rgba(13,148,136,.14);
}
.selector-summary strong { color:var(--accent); }
.selector-summary button { padding:7px 12px; border:1px solid var(--accent); border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
.quote-fab {
  position:fixed; right:24px; bottom:84px; z-index:20; padding:11px 15px;
  border:0; border-radius:24px; background:var(--accent); color:#fff; font-weight:600;
  box-shadow:0 8px 24px rgba(13,148,136,.3); cursor:pointer;
}
.quote-drawer {
  position:fixed; top:0; right:0; bottom:0; z-index:30; width:min(460px, 92vw);
  padding:18px; overflow:auto; background:var(--panel); border-left:1px solid var(--border);
  box-shadow:-12px 0 32px rgba(15,23,42,.18); transform:translateX(105%); transition:transform .2s;
}
.quote-drawer.open { transform:translateX(0); }
.quote-drawer-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.quote-drawer-head h2 { margin:0; font-size:18px; }
.quote-drawer-head button { border:1px solid var(--border); background:var(--bg); border-radius:6px; padding:5px 8px; cursor:pointer; }
.quote-overview-group { margin:12px 0; padding:10px; border:1px solid var(--border); border-radius:8px; }
.quote-overview-group h3 { margin:0 0 7px; font-size:12px; color:var(--muted); text-transform:uppercase; }
.quote-overview-line { display:flex; justify-content:space-between; gap:12px; padding:4px 0; font-size:12px; }
.quote-overview-line span:last-child { white-space:nowrap; font-variant-numeric:tabular-nums; }
.discount-editor { margin:12px 24px 0; padding:12px; }
.discount-editor-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
.discount-editor-head h3 { margin:0; font-size:13px; }
.discount-tier-table { width:100%; border-collapse:collapse; }
.discount-tier-table th, .discount-tier-table td { padding:5px; border-bottom:1px solid var(--border); font-size:12px; }
.discount-tier-table input { width:100%; padding:5px; border:1px solid var(--border); border-radius:4px; }
.discount-tier-table button { border:1px solid var(--red); color:var(--red); background:var(--red-soft); border-radius:4px; cursor:pointer; }
.provisional { display:inline-block; padding:1px 6px; border-radius:10px; color:#9d174d; background:#fce7f3; font-size:10px; font-weight:600; }
.partner-only { display: none; }
body.reseller .partner-only { display: flex; }
body.reseller-buy .price-cell,
body.reseller-buy .pill .price,
body.reseller-buy .catalog-table .money,
body.reseller-buy .total-cell,
body.reseller-buy .tile .val,
body.reseller-buy .block-band .totals {
  color: #6d28d9;
}
body.reseller-buy .price-cell,
body.reseller-buy .catalog-table .money {
  background: var(--premium-soft);
  border-radius: 4px;
  padding: 3px 5px;
}
.price-mode-btn.buy-active { background: var(--premium); color: white; border-color: var(--premium); }
h1 .brand { color: var(--accent); }
.field { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.field label { color: var(--muted); font-weight: 500; }
.field input, .field select {
  font: inherit;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  color: var(--text);
}
.field input:focus, .field select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.field.numeric input {
  width: 110px;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
main {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 16px;
  padding: 16px 24px 32px;
  min-height: calc(100vh - 130px);
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
}
/* Distributor band */
.distributor {
  background: linear-gradient(to right, var(--accent-soft), #eff6ff);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 13px;
  position: sticky;
  top: 106px;
  z-index: 9;
}
.distributor strong { font-weight: 600; }
.distributor .help { color: var(--muted); font-size: 12px; }
/* Left panel */
.left .search-wrap {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--panel);
  z-index: 1;
}
.left .search-wrap input {
  width: 100%;
  padding: 7px 10px;
  font: inherit;
  border: 1px solid var(--border);
  border-radius: 6px;
}
.left .categories {
  padding: 8px 0;
  max-height: calc(100vh - 200px);
  overflow-y: auto;
}
.cat-group { border-bottom: 1px solid var(--border); }
.cat-group:last-child { border-bottom: none; }
.cat-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  user-select: none;
}
.cat-header:hover { background: var(--bg); }
.cat-header .icon { font-size: 16px; }
.cat-header .count {
  margin-left: auto;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0 8px;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
}
.cat-header .arrow { color: var(--muted); transition: transform .15s; }
.cat-group.collapsed .cat-header .arrow { transform: rotate(-90deg); }
.cat-group.collapsed .pills { display: none; }
.pills {
  padding: 4px 8px 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.pill {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px;
  padding: 7px 10px;
  border-radius: 6px;
  background: var(--bg);
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 12.5px;
  align-items: center;
}
.pill:hover { background: var(--accent-soft); border-color: var(--accent); }
.pill[data-status="parked"] { opacity: 0.45; cursor: not-allowed; }
.pill[data-status="parked"]:hover { background: var(--bg); border-color: transparent; }
.pill[data-status="premium"] { background: var(--premium-soft); }
.pill[data-status="premium"]:hover { background: #ddd6fe; border-color: var(--premium); }
.pill .name {
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pill .price {
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}
.pill[data-status="premium"] .price { color: var(--premium); font-weight: 600; }
/* Right panel */
.right { display: flex; flex-direction: column; gap: 16px; }
.scenario-panel { padding: 0; }
.scenario-head {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 13px;
  background: var(--panel);
}
.scenario-head .count { color: var(--muted); font-weight: 400; font-size: 12px; }
.scenario-head .clear-btn {
  margin-left: auto;
  padding: 4px 8px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 5px;
  font: inherit;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
}
.scenario-head .clear-btn:hover { background: var(--red-soft); border-color: var(--red); color: var(--red); }
.block-band {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.block-band::before { content:"▸"; font-size:11px; transition:transform .15s; }
.block-band.expanded::before { transform:rotate(90deg); }
.collapsible-content.collapsed { display:none; }
.block-band.block-a { background: var(--block-a-bg); color: var(--block-a-text); border-top: 2px solid var(--block-a-border); }
.block-band.block-b { background: var(--block-b-bg); color: var(--block-b-text); border-top: 2px solid var(--block-b-border); }
.block-band .totals {
  margin-left: auto;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  text-transform: none;
  letter-spacing: 0;
  font-size: 13px;
}
.scenario-empty {
  padding: 36px 14px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}
/* Block A quick-select palette — click chips to toggle fixed setup/license/maintenance items */
.block-a-palette {
  padding: 10px 12px;
  background: var(--block-a-bg);
  border-bottom: 1px solid var(--border);
}
.block-a-palette .pal-group { margin-bottom: 8px; }
.block-a-palette .pal-group:last-child { margin-bottom: 0; }
.block-a-palette .pal-cat {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--block-a-text);
  font-weight: 600;
  margin: 0 0 4px 2px;
}
.block-a-palette .pal-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.block-a-palette .pal-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  border-radius: 14px;
  background: #fff;
  border: 1px solid var(--block-a-border);
  cursor: pointer;
  font-size: 11.5px;
  color: var(--text);
  user-select: none;
  transition: background .1s, border-color .1s;
}
.block-a-palette .pal-chip:hover { border-color: var(--accent); }
.block-a-palette .pal-chip .pal-price {
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  font-size: 10.5px;
}
.block-a-palette .pal-chip.active {
  background: var(--block-a-chip-active);
  border-color: var(--block-a-chip-active);
  color: #fff;
}
.block-a-palette .pal-chip.active .pal-price { color: var(--block-a-chip-active-text); }
.block-a-palette .pal-chip.active::before { content: "✓ "; font-weight: 700; }
body.reseller-buy .block-a-palette .pal-chip .pal-price { display: none; }
.block-a-palette .pal-setup-section {
  margin: 7px 8px;
  padding: 9px 10px 10px;
  border: 1px solid var(--block-a-border);
  border-radius: 9px;
  background: rgba(255,255,255,.72);
}
.block-a-palette .pal-setup-section .pal-cat { padding: 0 0 7px; color: var(--block-a-text); font-size: 11px; }
.block-a-palette .pal-chip.pal-chip-nav { border-style: dashed; color: var(--accent); background: var(--accent-soft); }
.block-a-palette .pal-group-collapsible.collapsed .pal-chips { display: none; }
.block-a-palette .pal-cat-collapsible { cursor: pointer; user-select: none; }
.block-a-palette .pal-collapse-arrow { display: inline-block; transition: transform .15s; margin-left: 4px; }
.block-a-palette .pal-group-collapsible.collapsed .pal-collapse-arrow { transform: rotate(-90deg); }
.block-a-palette .pal-chip.pal-chip-info { background: #f9fafb; border-color: #d1d5db; color: var(--muted); font-style: italic; }
.block-a-palette .pal-chip.pal-chip-info:hover { background: var(--accent-soft); border-color: var(--accent); }
.block-a-palette .pal-chip.pal-chip-info.active { background: var(--block-a-chip-active); border-color: var(--block-a-chip-active); color: #fff; font-style: normal; }
.block-a-palette .pal-info-hint { font-size: 9.5px; color: #9ca3af; font-style: italic; margin-left: 3px; }
.block-a-palette .pal-chip.pal-chip-info.active .pal-info-hint { color: var(--block-a-chip-active-text); }
/* Block A row: SKU info | price | qty | total | remove */
.row-a {
  display: grid;
  grid-template-columns: 1fr 110px 90px 110px 26px;
  gap: 10px;
  align-items: center;
  padding: 7px 14px;
  border-bottom: 1px solid var(--border);
}
/* Block B row: SKU info | price | share | vol/mo | total | remove */
.row-b {
  display: grid;
  grid-template-columns: 1fr 110px 80px 110px 110px 26px;
  gap: 10px;
  align-items: center;
  padding: 7px 14px;
  border-bottom: 1px solid var(--border);
}
.row-a:last-child, .row-b:last-child { border-bottom: none; }
.row-a:hover, .row-b:hover { background: var(--bg); }
.sku-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sku-name {
  font-weight: 500;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sku-meta { font-size: 11px; color: var(--muted); }
.sku-meta .badge {
  display: inline-block;
  padding: 0 5px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 10px;
  margin-right: 4px;
}
.sku-meta .badge.plus-base {
  background: #dbeafe;
  border-color: var(--accent);
  color: var(--accent);
}
.price-cell {
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  color: var(--muted);
  text-align: right;
}
.share-cell, .vol-cell, .qty-cell {
  display: flex;
  align-items: center;
  gap: 4px;
}
.share-cell input, .vol-cell input, .qty-cell input {
  width: 100%;
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: 5px;
  font: inherit;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.share-cell input { width: 50px; }
.vol-cell input { width: 78px; }
.qty-cell input { width: 78px; }
.share-cell input.manual { background: var(--bg); color: var(--muted); }
.share-cell input:focus, .vol-cell input:focus, .qty-cell input:focus {
  outline: 2px solid var(--accent-soft);
  border-color: var(--accent);
}
.share-cell .pct, .vol-cell .unit-suffix, .qty-cell .unit-suffix {
  font-size: 11px;
  color: var(--muted);
}
.share-cell .reset {
  font-size: 10px;
  color: var(--accent);
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0;
}
.total-cell {
  font-variant-numeric: tabular-nums;
  text-align: right;
  font-weight: 500;
}
.remove-btn {
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  color: var(--muted);
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}
.remove-btn:hover { background: var(--red-soft); color: var(--red); }
/* Suggestions / Bundles */
.suggestions, .bundles { padding: 0; }
.suggestions-head, .bundles-head {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.suggestions-head .icon, .bundles-head .icon { font-size: 14px; }
.suggestions-list, .bundles-list { padding: 8px 14px; display: flex; flex-direction: column; gap: 6px; }
.suggestions-list:empty::before, .bundles-list:empty::before {
  content: "Nothing relevant right now.";
  color: var(--muted);
  font-size: 12px;
}
.sugg-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  padding: 8px 10px;
  background: var(--amber-soft);
  border: 1px solid #fbbf24;
  border-radius: 6px;
  align-items: center;
}
.sugg-card .text { font-size: 12.5px; }
.sugg-card .text strong { font-weight: 600; }
.sugg-card .text .reason { color: var(--block-b-text); font-size: 11.5px; display: block; margin-top: 1px; }
.sugg-card button {
  padding: 5px 10px;
  background: var(--amber);
  color: white;
  border: none;
  border-radius: 5px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.sugg-card button:hover { background: #b45309; }
.bundle-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  align-items: center;
}
.bundle-card .text strong { font-weight: 600; }
.bundle-card .text .desc { color: var(--muted); font-size: 12px; display: block; margin-top: 1px; }
.bundle-card button {
  padding: 5px 10px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 5px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.bundle-card button:hover { background: var(--accent-hover); }
/* Totals */
.totals { padding: 14px; }
.totals-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.tile {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
}
.tile .lbl { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tile .val { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
.tile.primary { background: var(--accent-soft); border-color: var(--accent); }
.tile.primary .val { color: var(--accent); font-size: 22px; }
.tile.green { background: var(--green-soft); border-color: var(--green); }
.tile.green .val { color: var(--green); }
.tile.amber { background: var(--amber-soft); border-color: var(--amber); }
.tile.amber .val { color: var(--amber); }
.compare-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
.compare-table th, .compare-table td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
}
.compare-table th { text-align: left; font-weight: 500; color: var(--muted); }
.compare-table tr.recommended { background: var(--green-soft); }
.compare-table tr.recommended td:first-child { font-weight: 600; color: var(--green); }
.actions { padding: 14px; display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--border); }
.btn {
  padding: 7px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hover); }
.notes { padding: 0 14px 14px; }
.notes textarea {
  width: 100%;
  min-height: 60px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font: inherit;
  font-size: 13px;
  resize: vertical;
}
@media print {
  header, .tabs, .distributor { position: static; }
  .left, .suggestions, .bundles, .actions, .notes textarea, .quote-fab, .quote-drawer { display: none; }
  main { grid-template-columns: 1fr; padding: 0; }
  .panel { box-shadow: none; border: 1px solid #ddd; }
  body { background: white; }
}
/* Header brand layout */
.header-brand { display: flex; align-items: center; gap: 10px; }
.header-logo { height: 36px; width: auto; display: block; }
h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
/* Theme toggle */
.theme-toggle-btn {
  padding: 5px 9px;
  font-size: 15px;
  line-height: 1;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
}
.theme-toggle-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
/* Dark mode: ensure form elements and panels pick up theme tokens */
:root[data-theme="dark"] input,
:root[data-theme="dark"] select,
:root[data-theme="dark"] textarea {
  background: var(--panel);
  color: var(--text);
  border-color: var(--border);
  color-scheme: dark;
}
:root[data-theme="dark"] .block-a-palette .pal-setup-section {
  background: rgba(0,0,0,.25);
}
:root[data-theme="dark"] .selector-summary {
  background: var(--panel);
}
:root[data-theme="dark"] .quote-drawer {
  background: var(--panel);
}
:root[data-theme="dark"] .sugg-card {
  border-color: var(--amber);
}
</style>

</script>

"then_add": ["PLAT-PERSONA-OPEN"]}], "discount_schedules": {"umbrella": [[0, 4999, 0.0, 0.0], [5000, 10000, 0.04, 0.09], [10001, 25000, 0.09, 0.155], [25001, 75000, 0.14, 0.22], [75001, 250000, 0.225, 0.35], [250001, 9999999999, 0.3, 0.45]], "eid-esigning": [[0, 9999999999, 0.0, 0.0]], "account-origination": [[0, 9999999999, 0.0, 0.0]], "aletheia": [[0, 9999999999, 0.0, 0.0]]}, "internal": true, "reseller": false, "reseller_discount_pct": 25}</script>
<script>
(function() {
  "use strict";
  const DATA = JSON.parse(document.getElementById("cockpit-data").textContent);
  const SKU_BY_ID = Object.fromEntries(DATA.skus.map(s => [s.id, s]));
  const OCCURRENCE_TYPES = ["transaction", "month", "year", "setup", "one-time", "project", "week"];
  const SURFACES = ["general", "account-origination", "aletheia"];
  const API_BASE = "/pricing/api";
  const LOCAL_OVERRIDES_KEY = "idcanopy-pricing-local-overrides-v1";
  const DISCOUNT_SCHEDULES_KEY = "idcanopy-pricing-discount-schedules-v1";
  let discountSchedules = JSON.parse(JSON.stringify(DATA.discount_schedules));
  let discountPeriod = "monthly";
  let resellerBuyMode = false;
  let resellerDiscountPct = Number(DATA.reseller_discount_pct) || 25;

  // ---- state ----
  // scenario row: {id, vol, share, manual}
  //   share = % of annual_apps basis (0–100+)
  //   manual = true if vol was directly edited, share is ignored
  let scenario = [];
  let annualApps = 0;
  let existingBase = 0;

  // ---- compute ----
  function computeRow(sku, vol) {
    const p = effectiveUnitPrice(sku);
    const out = { monthly: 0, oneTime: 0, computable: false };
    if (typeof p !== "number") return out;
    out.computable = true;
    const v = Number(vol) || 0;
    switch (sku.unit) {
      case "transaction":
        out.monthly = p * v;
        break;
      case "month":
        out.monthly = p * Math.max(v, 1);
        break;
      case "year":
        out.monthly = (p / 12) * Math.max(v, 1);
        break;
      case "setup":
      case "one-time":
      case "project":
        out.oneTime = p * Math.max(v, 1);
        break;
      case "week":
        out.oneTime = p * v;
        break;
    }
    return out;
  }

  function deriveVol(sku, sharePct) {
    const basis = sku.volume_basis;
    const share = (Number(sharePct) || 0) / 100;
    if (basis === "fixed") return 1;
    let total = 0;
    if (basis === "apps") total = annualApps;
    else if (basis === "apps+base") total = annualApps + existingBase;
    if (sku.unit === "transaction") return Math.round(total * share / 12);
    if (sku.unit === "year") return Math.round(total * share);
    return 1;
  }

  function priceUnitSuffix(unit) {
    switch (unit) {
      case "transaction": return "/tx";
      case "month": return "/mo";
      case "year": return "/yr";
      case "setup": case "one-time": case "project": return "fix";
      case "week": return "wk";
      default: return "";
    }
  }

  function volumeUnitSuffix(unit) {
    switch (unit) {
      case "transaction": return "tx/mo";
      case "month": return "mo";
      case "year": return "records";
      case "setup": case "one-time": case "project": return "qty";
      case "week": return "wk";
      default: return "";
    }
  }

  function eur(n, decimals = 0) {
    if (!isFinite(n)) return "—";
    return "€" + n.toLocaleString("de-DE", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }

  function fmtPrice(p, unit) {
    if (typeof p !== "number") return String(p ?? "");
    return "€" + p.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + priceUnitSuffix(unit);
  }

  function resellerDiscountFor(sku) {
    if (!DATA.reseller) return 0;
    if (sku.program === "Umbrella Project" || sku.unit === "project" || sku.unit === "week") return 5;
    if (
      sku.program === "Umbrella Platform" ||
      sku.program === "Umbrella Packages" ||
      sku.program === "Umbrella SLA" ||
      sku.unit === "setup" ||
      sku.unit === "month" ||
      sku.unit === "year" ||
      sku.unit === "one-time"
    ) return 10;
    return resellerDiscountPct;
  }

  function effectiveUnitPrice(sku) {
    if (typeof sku.list_price !== "number") return sku.list_price;
    if (!DATA.reseller || !resellerBuyMode) return sku.list_price;
    return sku.list_price * (1 - resellerDiscountFor(sku) / 100);
  }

  function fmtSkuPrice(sku) {
    const p = effectiveUnitPrice(sku);
    if (typeof p !== "number") return escapeHtml(String(p ?? ""));
    const label = fmtPrice(p, sku.unit);
    if (!DATA.reseller || !resellerBuyMode) return label;
    return `${label} <span class="badge">${resellerDiscountFor(sku)}% off</span>`;
  }

  function lookupBand(family, monthly) {
    for (const [lo, hi, payg, prep] of (discountSchedules[family] || [])) {
      if (monthly >= lo && monthly <= hi) return { payg, prep };
    }
    return { payg: 0, prep: 0 };
  }

  function effectiveDiscount(term, payg, prep) {
    if (term === "PAYG") return payg;
    if (term.startsWith("Prepaid")) return prep;
    return 0;
  }

  function discountedMonthlyForTerm(term) {
    const familyConsumption = {};
    scenario.forEach(({id, vol}) => {
      const s = SKU_BY_ID[id];
      if (!s || s.discount_eligible === false) return;
      const monthly = computeRow(s, vol).monthly;
      familyConsumption[s.discount_family || "umbrella"] = (familyConsumption[s.discount_family || "umbrella"] || 0) + monthly;
    });
    return scenario.reduce((total, {id, vol}) => {
      const s = SKU_BY_ID[id];
      if (!s) return total;
      const monthly = computeRow(s, vol).monthly;
      if (s.discount_eligible === false) return total + monthly;
      const family = s.discount_family || "umbrella";
      const band = lookupBand(family, familyConsumption[family] || 0);
      return total + monthly * (1 - effectiveDiscount(term, band.payg, band.prep));
    }, 0);
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
  }

  function cssEscape(s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/[^a-zA-Z0-9_-]/g, ch => "\\" + ch);
  }

  // ---- left categories ----
  // Quick-select palette for Block A (fixed setup/license/maintenance).
  // Four setup spaces: regular platform, eID/eSigning, Aletheia, Account Origination.
  // Dedicated-surface selections appear here once chosen in their respective menus.
  function renderBlockAPalette() {
    const root = document.getElementById("block-a-palette");
    if (!root) return;
    root.innerHTML = "";
    const inScenario = new Set(scenario.map(r => r.id));

    function makeChip(s, labelOverride, opts) {
      opts = opts || {};
      const chip = document.createElement("div");
      chip.dataset.skuId = s.id;
      const isActive = inScenario.has(s.id);
      const cls = ["pal-chip"];
      if (isActive) cls.push("active");
      if (opts.informative) cls.push("pal-chip-info");
      chip.className = cls.join(" ");
      chip.title = (s.description || "") + (s.note ? "\n\n" + s.note : "");
      const ep = effectiveUnitPrice(s);
      const priceTxt = !opts.informative && typeof ep === "number" ? fmtPrice(ep, s.unit) : "";
      const nameLabel = labelOverride != null ? labelOverride : escapeHtml(s.name);
      const priceSpan = priceTxt ? `<span class="pal-price">${escapeHtml(priceTxt)}</span>` : "";
      const infoHint = opts.informative ? `<span class="pal-info-hint">dedicated setup</span>` : "";
      chip.innerHTML = `<span class="pal-name">${nameLabel}</span>${priceSpan}${infoHint}`;
      chip.addEventListener("click", () => {
        if (inScenario.has(s.id)) removeFromScenario(s.id);
        else {
          (opts.exclusiveWith || []).forEach(id => {
            if (inScenario.has(id)) removeFromScenario(id);
          });
          addToScenario(s.id);
        }
      });
      return chip;
    }

    function makeSection(title, skuDefs, opts) {
      opts = opts || {};
      skuDefs = skuDefs.filter(d => SKU_BY_ID[d.id] && !SKU_BY_ID[d.id].is_deleted);
      if (!skuDefs.length) return;
      const collapsed = opts.collapsed && !skuDefs.some(d => inScenario.has(d.id));
      const group = document.createElement("div");
      group.className = "pal-group" + (opts.setup ? " pal-setup-section" : "") + (opts.collapsible ? " pal-group-collapsible" : "") + (collapsed ? " collapsed" : "");
      const head = document.createElement("div");
      head.className = "pal-cat" + (opts.collapsible ? " pal-cat-collapsible" : "");
      head.innerHTML = escapeHtml(title) + (opts.collapsible ? ` <span class="pal-collapse-arrow">▾</span>` : "");
      if (opts.collapsible) {
        head.addEventListener("click", () => group.classList.toggle("collapsed"));
      }
      group.appendChild(head);
      const chips = document.createElement("div");
      chips.className = "pal-chips";
      skuDefs.forEach((def, i) => {
        const s = SKU_BY_ID[def.id];
        if (!s || s.status === "parked") return;
        chips.appendChild(makeChip(s, def.label != null ? escapeHtml(def.label) : null, def));
      });
      group.appendChild(chips);
      root.appendChild(group);
    }

    function makeDedicatedSection(title, surface, view) {
      const selected = DATA.skus
        .filter(s => s.surface === surface && s.block === "fixed" && !s.is_deleted && inScenario.has(s.id))
        .map(s => ({id: s.id}));
      const group = document.createElement("div");
      group.className = "pal-group pal-setup-section";
      const head = document.createElement("div");
      head.className = "pal-cat";
      head.textContent = title;
      group.appendChild(head);
      const chips = document.createElement("div");
      chips.className = "pal-chips";
      selected.forEach(def => chips.appendChild(makeChip(SKU_BY_ID[def.id], null, {})));
      const nav = document.createElement("div");
      nav.className = "pal-chip pal-chip-nav";
      nav.innerHTML = `<span class="pal-name">${selected.length ? "Edit selection" : "Select setup components"}</span>`;
      nav.addEventListener("click", () => setView(view));
      chips.appendChild(nav);
      group.appendChild(chips);
      root.appendChild(group);
    }

    // (1) Regular setup — regulated and non-regulated are mutually exclusive.
    makeSection("1. Regular platform setup", [
      {id: "PLAT-CANOPY-FI", label: "Regulated", exclusiveWith: ["PLAT-CANOPY-NONFI"]},
      {id: "PLAT-CANOPY-NONFI", label: "Non-regulated", exclusiveWith: ["PLAT-CANOPY-FI"]},
    ], {setup: true});

    // (2) eID/eSigning — fully visible, including Persona and Namirial route components.
    makeSection("2. eID / eSigning setup", [
      {id: "PLAT-PERSONA-CLOSED"}, {id: "PLAT-PERSONA-OPEN"}, {id: "PLAT-PERSONA-CUSTOM"},
      {id: "NOB-SETUP"}, {id: "NOB-ANNUAL"}, {id: "IDHUB-SETUP"}, {id: "IDHUB-ANNUAL"},
      {id: "ETSI-SETUP"}, {id: "ESAW-SETUP"}, {id: "ESAW-ATRUST-FLAT"},
    ], {setup: true});

    // (3-4) Dedicated setup menus — show their selected fixed components in the quote builder.
    makeDedicatedSection("3. Aletheia setup", "aletheia", "aletheia");
    makeDedicatedSection("4. Account Origination setup", "account-origination", "account-origination");

    // Remaining general fixed non-setup SKUs.
    const EXPLICIT_IDS = new Set([
      "PLAT-CANOPY-FI", "PLAT-CANOPY-NONFI",
      "PLAT-PERSONA-CLOSED", "PLAT-PERSONA-OPEN", "PLAT-PERSONA-CUSTOM",
      "NOB-SETUP", "NOB-ANNUAL", "IDHUB-SETUP", "IDHUB-ANNUAL", "ETSI-SETUP", "ESAW-SETUP", "ESAW-ATRUST-FLAT",
      "INFO-AO-SETUP", "INFO-ALETHEIA-SETUP",
    ]);
    const byCat = {};
    DATA.skus.forEach(s => {
      if (s.surface !== "general" || s.block !== "fixed") return;
      if (s.is_deleted) return;
      if (s.status === "parked") return;
      if (EXPLICIT_IDS.has(s.id)) return;
      if (s.subcategory === "dedicated-setup") return;
      (byCat[s.category] = byCat[s.category] || []).push(s);
    });
    const order = [...DATA.category_order, ...Object.keys(byCat).filter(c => !DATA.category_order.includes(c))];
    const hasRemaining = order.some(cat => byCat[cat] && byCat[cat].length);
    if (hasRemaining) {
      const sectionLabel = document.createElement("div");
      sectionLabel.className = "pal-group";
      const lhead = document.createElement("div");
      lhead.className = "pal-cat";
      lhead.textContent = "License & recurring";
      sectionLabel.appendChild(lhead);
      root.appendChild(sectionLabel);
      order.forEach(cat => {
        const list = byCat[cat];
        if (!list || !list.length) return;
        const group = document.createElement("div");
        group.className = "pal-group";
        const catHead = document.createElement("div");
        catHead.className = "pal-cat";
        catHead.style.paddingLeft = "16px";
        catHead.textContent = cat;
        group.appendChild(catHead);
        const chips = document.createElement("div");
        chips.className = "pal-chips";
        list.forEach(s => chips.appendChild(makeChip(s, null, {})));
        group.appendChild(chips);
        root.appendChild(group);
      });
    }
  }

  function renderCategories(filterText = "") {
    const root = document.getElementById("categories");
    root.innerHTML = "";
    const filter = filterText.trim().toLowerCase();
    const skusByCat = {};
    DATA.category_order.forEach(c => skusByCat[c] = []);
    DATA.skus.forEach(s => {
      if (s.surface !== "general") return;
      if (s.is_deleted) return;
      if (s.block === "fixed") return;  // fixed setup/license/maintenance live in the Block A quick-select palette
      if (s.subcategory === "dedicated-setup") return;  // informative pseudo-SKUs — palette only
      if (!skusByCat[s.category]) skusByCat[s.category] = [];
      const matches = !filter || (
        s.name.toLowerCase().includes(filter) ||
        s.id.toLowerCase().includes(filter) ||
        (s.description && s.description.toLowerCase().includes(filter)) ||
        (s.route && s.route.toLowerCase().includes(filter))
      );
      if (matches) skusByCat[s.category].push(s);
    });
    const order = [...DATA.category_order, ...Object.keys(skusByCat).filter(c => !DATA.category_order.includes(c))];
    order.forEach(cat => {
      const list = skusByCat[cat] || [];
      if (!list.length) return;
      const group = document.createElement("div");
      group.className = "cat-group";
      if (cat === "Roadmap" && !filter) group.classList.add("collapsed");
      const header = document.createElement("div");
      header.className = "cat-header";
      const icon = list[0].icon || "";
      header.innerHTML = `<span class="icon">${icon}</span><span class="label">${cat}</span><span class="count">${list.length}</span><span class="arrow">▾</span>`;
      header.addEventListener("click", () => group.classList.toggle("collapsed"));
      group.appendChild(header);
      const pillsBox = document.createElement("div");
      pillsBox.className = "pills";
      list.forEach(s => {
        const pill = document.createElement("div");
        pill.className = "pill";
        pill.dataset.status = s.status || "active";
        pill.title = (s.description || "") + (s.note ? "\n\n" + s.note : "");
        const effectivePrice = effectiveUnitPrice(s);
        const priceTxt = typeof effectivePrice === "number" ? fmtPrice(effectivePrice, s.unit) : String(effectivePrice ?? "");
        pill.innerHTML = `<span class="name">${escapeHtml(s.name)}</span><span class="price">${escapeHtml(priceTxt)}</span>`;
        if (s.status !== "parked") {
          pill.addEventListener("click", () => addToScenario(s.id));
        }
        pillsBox.appendChild(pill);
      });
      group.appendChild(pillsBox);
      root.appendChild(group);
    });
  }

  // ---- scenario actions ----
  function addToScenario(id, opts = {}) {
    if (scenario.some(r => r.id === id)) {
      flashStatus(`Already in scenario: ${SKU_BY_ID[id].name}`);
      return;
    }
    const sku = SKU_BY_ID[id];
    if (!sku || sku.is_deleted) return;
    const share = opts.share != null ? opts.share : (sku.default_share_pct ?? 100);
    let vol;
    if (opts.vol != null) {
      vol = opts.vol;
    } else if (sku.block === "fixed") {
      vol = 1;
    } else {
      vol = deriveVol(sku, share);
    }
    const manual = opts.manual === true;
    scenario.push({ id, vol, share, manual });
    renderScenario();
    renderSuggestions();
    renderTotals();
    saveAuto();
  }

  function removeFromScenario(id) {
    scenario = scenario.filter(r => r.id !== id);
    renderScenario();
    renderSuggestions();
    renderTotals();
    saveAuto();
  }

  function setShare(id, share) {
    const r = scenario.find(x => x.id === id);
    if (!r) return;
    r.share = Number(share);
    if (!isFinite(r.share)) r.share = 0;
    r.manual = false;
    const sku = SKU_BY_ID[id];
    if (sku) r.vol = deriveVol(sku, r.share);
    updateRowBVisuals(id);
    renderTotals();
    saveAuto();
  }

  function setVolManual(id, vol) {
    const r = scenario.find(x => x.id === id);
    if (!r) return;
    r.vol = Number(vol);
    if (!isFinite(r.vol)) r.vol = 0;
    r.manual = true;
    updateRowBVisuals(id);
    renderTotals();
    saveAuto();
  }

  function setQty(id, qty) {
    // Block A — always manual qty
    const r = scenario.find(x => x.id === id);
    if (!r) return;
    r.vol = Math.max(Number(qty) || 0, 0);
    r.manual = true;
    updateRowATotal(id);
    renderTotals();
    saveAuto();
  }

  function resetRowToShare(id) {
    const r = scenario.find(x => x.id === id);
    if (!r) return;
    const sku = SKU_BY_ID[id];
    if (!sku) return;
    r.manual = false;
    r.vol = deriveVol(sku, r.share);
    updateRowBVisuals(id);
    renderTotals();
    saveAuto();
  }

  function clearAll() {
    if (scenario.length && !confirm("Clear all scenario lines?")) return;
    scenario = [];
    renderScenario();
    renderSuggestions();
    renderTotals();
    saveAuto();
  }

  function applyBundle(bundle) {
    if (typeof bundle.default_annual_apps === "number") {
      annualApps = bundle.default_annual_apps;
      document.getElementById("annual-apps").value = annualApps;
    }
    if (typeof bundle.default_existing_base === "number") {
      existingBase = bundle.default_existing_base;
      document.getElementById("existing-base").value = existingBase;
    }
    bundle.items.forEach(item => {
      const [sku_id, share] = item;
      const idx = scenario.findIndex(r => r.id === sku_id);
      const sku = SKU_BY_ID[sku_id];
      if (!sku) return;
      const vol = sku.block === "fixed" ? 1 : deriveVol(sku, share);
      if (idx >= 0) {
        scenario[idx].share = share;
        scenario[idx].vol = vol;
        scenario[idx].manual = false;
      } else {
        scenario.push({ id: sku_id, share, vol, manual: false });
      }
    });
    flashStatus(`Loaded bundle: ${bundle.name}`);
    renderScenario();
    renderSuggestions();
    renderTotals();
    saveAuto();
  }

  function setAnnualApps(n) {
    annualApps = Math.max(Number(n) || 0, 0);
    recomputeFromBasis();
    saveAuto();
  }

  function setExistingBase(n) {
    existingBase = Math.max(Number(n) || 0, 0);
    recomputeFromBasis();
    saveAuto();
  }

  function recomputeFromBasis() {
    scenario.forEach(r => {
      if (r.manual) return;
      const sku = SKU_BY_ID[r.id];
      if (!sku) return;
      if (sku.volume_basis === "apps" || sku.volume_basis === "apps+base") {
        r.vol = deriveVol(sku, r.share);
        // Update vol-cell input value (without destroying it) + total cell
        const row = document.querySelector(`.row-b[data-sku-id="${cssEscape(r.id)}"]`);
        if (row) {
          const volInput = row.querySelector(".vol-cell input");
          if (volInput && document.activeElement !== volInput) {
            volInput.value = r.vol;
          }
          updateRowBTotal(r.id);
        }
      }
    });
    renderTotals();
  }

  function resetSharesToDefaults() {
    scenario.forEach(r => {
      const sku = SKU_BY_ID[r.id];
      if (!sku) return;
      r.share = sku.default_share_pct ?? 100;
      r.manual = false;
      r.vol = sku.block === "fixed" ? 1 : deriveVol(sku, r.share);
    });
    renderScenario();
    renderTotals();
    saveAuto();
  }

  // ---- render: scenario blocks ----
  function renderScenario() {
    renderBlockAPalette();
    const setupRowsRoot = document.getElementById("setup-rows");
    const recurringRowsRoot = document.getElementById("recurring-rows");
    const blockB = document.getElementById("block-b-rows");
    setupRowsRoot.innerHTML = "";
    recurringRowsRoot.innerHTML = "";
    blockB.innerHTML = "";

    document.getElementById("scenario-count").textContent =
      scenario.length ? `${scenario.length} line${scenario.length===1?"":"s"}` : "";

    if (!scenario.length) {
      setupRowsRoot.innerHTML = `<div class="scenario-empty">Selected setup and one-time services will land here.</div>`;
      recurringRowsRoot.innerHTML = `<div class="scenario-empty">Selected recurring services will land here.</div>`;
      blockB.innerHTML = `<div class="scenario-empty">Transaction-driven items will land here. Set <em>Annual applications</em> + <em>Existing customer base</em> at the top to auto-distribute volumes.</div>`;
      updateBlockBands();
      return;
    }

    const fixedRows = scenario.filter(r => SKU_BY_ID[r.id]?.block === "fixed");
    const setupRows = fixedRows.filter(r => !["month", "year"].includes(SKU_BY_ID[r.id]?.unit));
    const recurringRows = fixedRows.filter(r => ["month", "year"].includes(SKU_BY_ID[r.id]?.unit));
    const varRows = scenario.filter(r => SKU_BY_ID[r.id]?.block === "variable");

    if (!setupRows.length) setupRowsRoot.innerHTML = `<div class="scenario-empty" style="padding:14px;">No setup or one-time items yet.</div>`;
    else setupRows.forEach(r => setupRowsRoot.appendChild(makeRowA(r)));
    if (!recurringRows.length) recurringRowsRoot.innerHTML = `<div class="scenario-empty" style="padding:14px;">No recurring items yet.</div>`;
    else recurringRows.forEach(r => recurringRowsRoot.appendChild(makeRowA(r)));
    if (!varRows.length) {
      blockB.innerHTML = `<div class="scenario-empty" style="padding:14px;">No transaction items yet.</div>`;
    } else {
      varRows.forEach(r => blockB.appendChild(makeRowB(r)));
    }
    updateBlockBands();
  }

  function makeRowA(r) {
    const s = SKU_BY_ID[r.id];
    const computed = computeRow(s, r.vol);
    const row = document.createElement("div");
    row.className = "row-a";
    row.dataset.skuId = r.id;
    const meta = [];
    if (s.route) meta.push(`<span class="badge">${escapeHtml(s.route)}</span>`);
    if (s.regulatory_window) meta.push(`<span class="badge">${escapeHtml(s.regulatory_window)}</span>`);
    meta.push(escapeHtml(s.id));
    const priceCell = fmtSkuPrice(s);
    const totalTxt = computed.computable
      ? (s.unit === "setup" || s.unit === "one-time" || s.unit === "project" || s.unit === "week"
          ? eur(computed.oneTime, 0)
          : eur(computed.monthly, 0))
      : `<span style="color: var(--amber)">manual</span>`;
    row.innerHTML = `
      <div class="sku-info">
        <span class="sku-name">${escapeHtml(s.name)}</span>
        <span class="sku-meta">${meta.join(" ")}</span>
      </div>
      <div class="price-cell">${priceCell}</div>
      <div class="qty-cell">
        <input type="number" min="0" step="any" value="${r.vol}" data-sku="${escapeHtml(r.id)}">
        <span class="unit-suffix">${volumeUnitSuffix(s.unit)}</span>
      </div>
      <div class="total-cell">${totalTxt}</div>
      <button class="remove-btn" data-sku="${escapeHtml(r.id)}" title="Remove">✕</button>
    `;
    row.querySelector(".qty-cell input").addEventListener("input", e => setQty(e.target.dataset.sku, e.target.value));
    row.querySelector(".remove-btn").addEventListener("click", e => removeFromScenario(e.target.dataset.sku));
    return row;
  }

  function makeRowB(r) {
    const s = SKU_BY_ID[r.id];
    const computed = computeRow(s, r.vol);
    const row = document.createElement("div");
    row.className = "row-b";
    row.dataset.skuId = r.id;
    const meta = [];
    if (s.route) meta.push(`<span class="badge">${escapeHtml(s.route)}</span>`);
    if (s.regulatory_window) meta.push(`<span class="badge">${escapeHtml(s.regulatory_window)}</span>`);
    if (s.volume_basis === "apps+base") meta.push(`<span class="badge plus-base" title="Volume includes existing customer base">+B</span>`);
    meta.push(escapeHtml(s.id));
    const priceCell = fmtSkuPrice(s);
    const totalTxt = computed.computable
      ? eur(computed.monthly, 0)
      : `<span style="color: var(--amber)">manual</span>`;
    const shareInputClass = r.manual ? "manual" : "";
    const shareTitle = r.manual ? "Volume manually set — share is ignored. Click ↻ to switch back to share-driven." : "Share % of annual basis";
    const resetBtn = r.manual
      ? `<button class="reset" data-sku="${escapeHtml(r.id)}" title="Reset to share-derived volume">↻</button>`
      : "";
    row.innerHTML = `
      <div class="sku-info">
        <span class="sku-name">${escapeHtml(s.name)}</span>
        <span class="sku-meta">${meta.join(" ")}</span>
      </div>
      <div class="price-cell">${priceCell}</div>
      <div class="share-cell" title="${shareTitle}">
        <input type="number" min="0" step="1" value="${r.share}" class="${shareInputClass}" data-sku="${escapeHtml(r.id)}" ${r.manual ? "disabled" : ""}>
        <span class="pct">%</span>
        ${resetBtn}
      </div>
      <div class="vol-cell">
        <input type="number" min="0" step="any" value="${r.vol}" data-sku="${escapeHtml(r.id)}">
        <span class="unit-suffix">${volumeUnitSuffix(s.unit)}</span>
      </div>
      <div class="total-cell">${totalTxt}</div>
      <button class="remove-btn" data-sku="${escapeHtml(r.id)}" title="Remove">✕</button>
    `;
    row.querySelector(".share-cell input").addEventListener("input", e => setShare(e.target.dataset.sku, e.target.value));
    row.querySelector(".vol-cell input").addEventListener("input", e => setVolManual(e.target.dataset.sku, e.target.value));
    if (r.manual) {
      row.querySelector(".share-cell .reset").addEventListener("click", e => resetRowToShare(e.target.dataset.sku));
    }
    row.querySelector(".remove-btn").addEventListener("click", e => removeFromScenario(e.target.dataset.sku));
    return row;
  }

  function updateRowATotal(id) {
    const s = SKU_BY_ID[id];
    if (!s) return;
    const r = scenario.find(x => x.id === id);
    if (!r) return;
    const row = document.querySelector(`.row-a[data-sku-id="${cssEscape(id)}"]`);
    if (!row) return;
    const cell = row.querySelector(".total-cell");
    if (!cell) return;
    const computed = computeRow(s, r.vol);
    if (computed.computable) {
      const isOneTime = ["setup","one-time","project","week"].includes(s.unit);
      cell.textContent = isOneTime ? eur(computed.oneTime, 0) : eur(computed.monthly, 0);
    } else {
      cell.innerHTML = '<span style="color: var(--amber)">manual</span>';
    }
    updateBlockBands();
  }

  function updateRowBTotal(id) {
    const s = SKU_BY_ID[id];
    if (!s) return;
    const r = scenario.find(x => x.id === id);
    if (!r) return;
    const row = document.querySelector(`.row-b[data-sku-id="${cssEscape(id)}"]`);
    if (!row) return;
    const cell = row.querySelector(".total-cell");
    if (!cell) return;
    const computed = computeRow(s, r.vol);
    cell.textContent = computed.computable ? eur(computed.monthly, 0) : "manual";
    updateBlockBands();
  }

  function updateRowBVisuals(id) {
    // Update vol input (if not focused), share input style, total
    const row = document.querySelector(`.row-b[data-sku-id="${cssEscape(id)}"]`);
    if (!row) return;
    const r = scenario.find(x => x.id === id);
    if (!r) return;
    const volInput = row.querySelector(".vol-cell input");
    if (volInput && document.activeElement !== volInput) {
      volInput.value = r.vol;
    }
    const shareInput = row.querySelector(".share-cell input");
    if (shareInput) {
      if (r.manual) {
        shareInput.classList.add("manual");
        shareInput.disabled = true;
        if (!row.querySelector(".share-cell .reset")) {
          const btn = document.createElement("button");
          btn.className = "reset";
          btn.dataset.sku = id;
          btn.title = "Reset to share-derived volume";
          btn.textContent = "↻";
          btn.addEventListener("click", e => resetRowToShare(e.target.dataset.sku));
          row.querySelector(".share-cell").appendChild(btn);
        }
      } else {
        shareInput.classList.remove("manual");
        shareInput.disabled = false;
        if (document.activeElement !== shareInput) shareInput.value = r.share;
        const btn = row.querySelector(".share-cell .reset");
        if (btn) btn.remove();
      }
    }
    updateRowBTotal(id);
  }

  function updateBlockBands() {
    let recurringMonthly = 0, setupOneTime = 0, bMonthly = 0;
    scenario.forEach(r => {
      const s = SKU_BY_ID[r.id];
      if (!s) return;
      const c = computeRow(s, r.vol);
      if (s.block === "fixed") {
        recurringMonthly += c.monthly;
        setupOneTime += c.oneTime;
      } else {
        bMonthly += c.monthly;
      }
    });
    document.getElementById("setup-totals").textContent = `${eur(setupOneTime, 0)} one-time`;
    document.getElementById("recurring-totals").textContent = `${eur(recurringMonthly, 0)}/mo`;
    document.getElementById("block-b-totals").textContent =
      `${eur(bMonthly, 0)}/mo`;
  }

  // ---- suggestions ----
  function renderSuggestions() {
    const root = document.getElementById("suggestions-list");
    root.innerHTML = "";
    const idsInScenario = new Set(scenario.map(r => r.id));
    const cats = new Set(scenario.map(r => SKU_BY_ID[r.id]?.category).filter(Boolean));
    const matched = [];
    DATA.suggestions.forEach(rule => {
      const has = (rule.if_has || []).some(id => idsInScenario.has(id));
      const hasProgram = (rule.if_has_any_program || []).some(c => cats.has(c));
      const trigger = has || hasProgram;
      if (!trigger) return;
      let stillMissing;
      if (rule.if_missing_all && rule.if_missing_all.length) {
        stillMissing = rule.if_missing_all.every(id => !idsInScenario.has(id));
      } else {
        stillMissing = rule.then_add.some(id => !idsInScenario.has(id));
      }
      if (!stillMissing) return;
      const toAdd = rule.then_add.filter(id => !idsInScenario.has(id));
      if (!toAdd.length) return;
      matched.push({ rule, toAdd });
    });
    matched.forEach(({rule, toAdd}) => {
      const card = document.createElement("div");
      card.className = "sugg-card";
      const labelTxt = toAdd.map(id => SKU_BY_ID[id]?.name || id).join(" + ");
      card.innerHTML = `
        <div class="text">
          <strong>${escapeHtml(rule.label)}</strong>
          <span class="reason">${escapeHtml(rule.reason)} · adds: ${escapeHtml(labelTxt)}</span>
        </div>
        <button>+ Add</button>
      `;
      card.querySelector("button").addEventListener("click", () => {
        toAdd.forEach(id => addToScenario(id));
      });
      root.appendChild(card);
    });
  }

  function renderBundles() {
    const root = document.getElementById("bundles-list");
    root.innerHTML = "";
    DATA.bundles.forEach(b => {
      const card = document.createElement("div");
      card.className = "bundle-card";
      card.innerHTML = `
        <div class="text">
          <strong>${escapeHtml(b.name)}</strong>
          <span class="desc">${escapeHtml(b.description)} · ${b.items.length} SKUs</span>
        </div>
        <button>Apply</button>
      `;
      card.querySelector("button").addEventListener("click", () => applyBundle(b));
      root.appendChild(card);
    });
  }

  // ---- totals ----
  function renderTotals() {
    let monthly = 0, oneTime = 0;
    scenario.forEach(({id, vol}) => {
      const s = SKU_BY_ID[id];
      if (!s) return;
      const r = computeRow(s, vol);
      monthly += r.monthly;
      oneTime += r.oneTime;
    });
    const term = document.getElementById("term").value;
    const discMo = discountedMonthlyForTerm(term);
    const eff = monthly > 0 ? 1 - (discMo / monthly) : 0;
    const annual = discMo * 12;
    const y1 = annual + oneTime;
    const y2 = annual;

    const root = document.getElementById("totals");
    const internalTotals = DATA.internal ? `
      <div class="totals-grid">
        <div class="tile"><div class="lbl">One-time</div><div class="val">${eur(oneTime, 0)}</div></div>
      </div>` : `
      <div class="totals-grid">
        <div class="tile"><div class="lbl">One-time</div><div class="val">${eur(oneTime, 0)}</div></div>
      </div>`;
    root.innerHTML = `
      <div style="font-weight:600; font-size:13px; margin-bottom: 10px;">${DATA.reseller && resellerBuyMode ? "Reseller buy totals" : "Customer totals"} · family discount schedules · ${term}</div>
      <div class="totals-grid">
        <div class="tile"><div class="lbl">Monthly recurring</div><div class="val">${eur(monthly, 0)}</div></div>
        <div class="tile"><div class="lbl">Discounted monthly (${(eff*100).toFixed(1)}%)</div><div class="val">${eur(discMo, 0)}</div></div>
        <div class="tile primary"><div class="lbl">Year 1 total</div><div class="val">${eur(y1, 0)}</div></div>
        <div class="tile green"><div class="lbl">Year 2+ total</div><div class="val">${eur(y2, 0)}</div></div>
      </div>
      ${internalTotals}
      <div style="font-weight:600; font-size:13px; margin: 12px 0 4px;">Compare terms</div>
      <table class="compare-table" id="compare-table"></table>
    `;
    const cmp = document.getElementById("compare-table");
    const terms = ["PAYG", "Prepaid"];
    cmp.innerHTML = `
      <tr><th>Term</th><th>Discount %</th><th>Monthly (disc.)</th><th>Year 1</th><th>Year 2+</th></tr>
      ${terms.map(t => {
        const dm = discountedMonthlyForTerm(t);
        const e = monthly > 0 ? 1 - (dm / monthly) : 0;
        const a = dm * 12;
        const y1t = a + oneTime;
        const isCurrent = t === term;
        return `<tr class="${isCurrent ? 'recommended' : ''}"><td>${t}${isCurrent ? ' ✓' : ''}</td><td>${(e*100).toFixed(1)}%</td><td>${eur(dm, 0)}</td><td>${eur(y1t, 0)}</td><td>${eur(a, 0)}</td></tr>`;
      }).join("")}
    `;
    renderQuoteOverview(monthly, oneTime, discMo, y1);
  }

  function renderQuoteOverview(monthly = 0, oneTime = 0, discountedMonthly = 0, year1 = 0) {
    const root = document.getElementById("quote-overview");
    if (!root) return;
    const groups = [
      ["Setup & one-time", r => SKU_BY_ID[r.id]?.block === "fixed" && !["month", "year"].includes(SKU_BY_ID[r.id]?.unit)],
      ["Recurring", r => SKU_BY_ID[r.id]?.block === "fixed" && ["month", "year"].includes(SKU_BY_ID[r.id]?.unit)],
      ["Transactions", r => SKU_BY_ID[r.id]?.block === "variable"],
    ];
    const groupHtml = groups.map(([label, predicate]) => {
      const rows = scenario.filter(predicate);
      if (!rows.length) return "";
      return `<div class="quote-overview-group"><h3>${label}</h3>${rows.map(r => {
        const s = SKU_BY_ID[r.id];
        const c = computeRow(s, r.vol);
        const total = c.oneTime ? `${eur(c.oneTime, 0)} one-time` : `${eur(c.monthly, 0)}/mo`;
        return `<div class="quote-overview-line"><span>${escapeHtml(s.name)}</span><span>${total}</span></div>`;
      }).join("")}</div>`;
    }).join("");
    root.innerHTML = `${groupHtml || '<div class="scenario-empty">No services selected yet.</div>'}
      <div class="quote-overview-group">
        <div class="quote-overview-line"><strong>Monthly recurring</strong><span>${eur(monthly, 0)}</span></div>
        <div class="quote-overview-line"><strong>Discounted monthly</strong><span>${eur(discountedMonthly, 0)}</span></div>
        <div class="quote-overview-line"><strong>One-time</strong><span>${eur(oneTime, 0)}</span></div>
        <div class="quote-overview-line"><strong>Year 1</strong><span>${eur(year1, 0)}</span></div>
      </div>`;
    if (DATA.internal && !isStaticReview()) renderV2QuoteRouting();
  }

  // ---- catalogue, special-package, and maintenance views ----
  function authHeaders() {
    const token = localStorage.getItem("bernieos_token");
    return token ? {"Content-Type": "application/json", "Authorization": `Bearer ${token}`} : {"Content-Type": "application/json"};
  }

  function setView(name) {
    document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.view === name));
    document.getElementById("quote-view").style.display = name === "quote" ? "grid" : "none";
    document.querySelector(".distributor").style.display = name === "quote" ? "flex" : "none";
    document.querySelectorAll(".view").forEach(view => view.classList.remove("active"));
    const target = document.getElementById(`${name}-view`);
    if (target) target.classList.add("active");
  }

  function catalogRows(surface = null) {
    return DATA.skus
      .filter(s => !s.is_deleted)
      .filter(s => !surface || s.surface === surface)
      .filter(s => s.subcategory !== "dedicated-setup")
      .sort((a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
  }

  function renderCatalogView(rootId, title, surface = null, intro = "", selectorMode = false) {
    const root = document.getElementById(rootId);
    const rows = catalogRows(surface);
    const surfaceBundles = selectorMode ? DATA.bundles.filter(b => b.surface === surface) : [];
    root.innerHTML = `
      <div class="catalog-head">
        <h2>${escapeHtml(title)}</h2>
        <input type="search" placeholder="Search ${escapeHtml(title.toLowerCase())}" data-catalog-search>

      });

    };

        if (selectorMode) draw(root.querySelector("[data-catalog-search]").value);
        else setView("quote");

    root.querySelector("[data-catalog-search]").addEventListener("input", e => draw(e.target.value));

      draw(root.querySelector("[data-catalog-search]").value);

  function localOverrides() {
    try { return JSON.parse(localStorage.getItem(LOCAL_OVERRIDES_KEY) || "{}"); }
    catch (e) { return {}; }
  }

  function saveLocalOverride(id, payload) {
    const overrides = localOverrides();
    overrides[id] = {sku_id: id, ...(overrides[id] || {}), ...payload};
    localStorage.setItem(LOCAL_OVERRIDES_KEY, JSON.stringify(overrides));
    return overrides[id];
  }

  function isStaticReview() {
    return location.protocol === "file:" || location.hostname.endsWith("github.io");
  }

  async function persistOverride(id, payload) {
    if (isStaticReview()) return saveLocalOverride(id, payload);
    const response = await fetch(`${API_BASE}/overrides/${encodeURIComponent(id)}`, {
      method: "PUT", headers: authHeaders(), body: JSON.stringify(payload),
    });
    if ([404, 405, 501].includes(response.status)) return saveLocalOverride(id, payload);
    if (!response.ok) {
      throw new Error(response.status === 401
        ? "Open Nerve and log in first; the pricing cockpit uses the same operator token."
        : `Save failed (${response.status})`);
    }
    return response.json();
  }

  async function saveMaintenanceRow(row) {
    const id = row.dataset.maintId;
    const value = field => row.querySelector(`[data-field="${field}"]`).value;
    const checked = field => row.querySelector(`[data-field="${field}"]`).checked;
    const numeric = field => value(field) === "" ? null : Number(value(field));
    const current = SKU_BY_ID[id];
    const payload = {
      name: value("name"),
      description: value("description"),
      category: value("category"),
      surface: value("surface"),
      occurrence_type: value("occurrence_type"),
      list_price: numeric("list_price"),
      pass_through_cost: numeric("pass_through_cost"),
      default_margin_pct: numeric("default_margin_pct"),
      discount_eligible: checked("discount_eligible"),
      is_custom: Boolean(current?.is_custom),
      is_deleted: false,
    };
    try {
      applyOverride(id, await persistOverride(id, payload));
    } catch (e) {
      alert(e.message);
      return;
    }
    flashStatus(`Saved ${id}${isStaticReview() ? " in this browser" : ""}`);
    renderAllCatalogViews();
    renderCategories(document.getElementById("search").value);
    renderScenario();
    renderTotals();
  }

  async function createSku(surface = "general") {
    const id = (prompt("New SKU code (for example CUSTOM-QES-01):") || "").trim().toUpperCase();
    if (!id) return;
    if (SKU_BY_ID[id] && !SKU_BY_ID[id].is_deleted) {
      alert(`SKU ${id} already exists.`);
      return;
    }
    const name = (prompt("SKU name:") || "").trim();
    if (!name) return;
    const payload = {
      name,
      description: "",
      category: "Custom",
      surface,
      occurrence_type: "transaction",
      list_price: 0,
      pass_through_cost: null,
      default_margin_pct: null,
      discount_eligible: true,
      is_custom: true,
      is_deleted: false,
    };
    try {
      applyOverride(id, await persistOverride(id, payload));
    } catch (e) {
      alert(e.message);
      return;
    }
    flashStatus(`Created ${id}${isStaticReview() ? " in this browser" : ""}`);
    renderAllCatalogViews();
    renderCategories(document.getElementById("search").value);
  }

  async function deleteMaintenanceRow(row) {
    const id = row.dataset.maintId;
    if (!confirm(`Delete ${id}? It will disappear from the catalog and active quote.`)) return;
    try {
      if (isStaticReview()) {
        saveLocalOverride(id, {is_deleted: true});
      } else {
        const response = await fetch(`${API_BASE}/overrides/${encodeURIComponent(id)}`, {
          method: "DELETE", headers: authHeaders(),
        });
        if ([404, 405, 501].includes(response.status)) saveLocalOverride(id, {is_deleted: true});
        else if (!response.ok) throw new Error(`Delete failed (${response.status})`);
      }
    } catch (e) {
      alert(e.message);
      return;
    }
    applyOverride(id, {is_deleted: true});
    scenario = scenario.filter(r => r.id !== id);
    flashStatus(`Deleted ${id}${isStaticReview() ? " in this browser" : ""}`);
    renderCategories(document.getElementById("search").value);
    renderScenario();
    renderSuggestions();
    renderTotals();
    renderAllCatalogViews();
    saveAuto();
  }

  function applyOverride(id, override) {
    let sku = SKU_BY_ID[id];
    if (!sku && override.is_custom) {
      sku = {
        id, name: override.name || id, description: override.description || "",
        category: override.category || "Custom", icon: "", program: "Operator managed",
        subcategory: "custom", unit: override.occurrence_type || "transaction",
        list_price: override.list_price ?? 0, pass_through_cost: override.pass_through_cost ?? null,
        default_margin_pct: override.default_margin_pct ?? null, route: "", sla_dependency: "",
        regulatory_window: "", compliance: "", status: "active", note: "",
        block: "variable", volume_basis: "apps", default_share_pct: 100,
        surface: override.surface || "general", is_custom: true, is_deleted: false,
        discount_eligible: override.discount_eligible !== false,
        discount_family: override.surface === "aletheia" ? "aletheia" : override.surface === "account-origination" ? "account-origination" : "umbrella",
      };
      SKU_BY_ID[id] = sku;
      DATA.skus.push(sku);
    }
    if (!sku) return;
    if (override.name) sku.name = override.name;
    if (override.description !== null && override.description !== undefined) sku.description = override.description;
    if (override.list_price !== null && override.list_price !== undefined) sku.list_price = Number(override.list_price);
    if (override.occurrence_type) sku.unit = override.occurrence_type;
    if (override.category) sku.category = override.category;
    if (override.surface) {
      sku.surface = override.surface;
      if (override.surface === "aletheia") sku.discount_family = "aletheia";
      else if (override.surface === "account-origination") sku.discount_family = "account-origination";
    }
    if (override.discount_eligible !== null && override.discount_eligible !== undefined) sku.discount_eligible = Boolean(override.discount_eligible);
    if (override.pass_through_cost !== null && override.pass_through_cost !== undefined) sku.pass_through_cost = Number(override.pass_through_cost);
    if (override.default_margin_pct !== null && override.default_margin_pct !== undefined) sku.default_margin_pct = Number(override.default_margin_pct);
    if (override.is_custom !== undefined) sku.is_custom = Boolean(override.is_custom);
    if (override.is_deleted !== undefined) sku.is_deleted = Boolean(override.is_deleted);
    sku.block = (sku.unit === "transaction" || (sku.unit === "year" && ["AML-MONITORING","AML-MONITORING-AM-SURCHARGE","KYB-TRMONITOR","GD-TRMONITOR","TB-FACEAUTH"].includes(id))) ? "variable" : "fixed";
    sku.volume_basis = sku.block === "variable" ? (sku.volume_basis === "apps+base" ? "apps+base" : "apps") : "fixed";
  }

  async function loadOverrides() {
    Object.values(localOverrides()).forEach(o => applyOverride(o.sku_id, o));
    if (isStaticReview()) return;
    try {
      const response = await fetch(`${API_BASE}/overrides`, {headers: authHeaders()});
      if (!response.ok) return;
      const payload = await response.json();
      payload.overrides.forEach(o => applyOverride(o.sku_id, o));
    } catch (e) {}
  }

  async function loadDiscountSchedules() {
    try {
      const saved = JSON.parse(localStorage.getItem(DISCOUNT_SCHEDULES_KEY) || "null");
      if (saved) discountSchedules = saved;
    } catch (e) {}
    if (isStaticReview()) return;
    try {

  async function saveDiscountSchedules(family) {
    localStorage.setItem(DISCOUNT_SCHEDULES_KEY, JSON.stringify(discountSchedules));
    if (!isStaticReview()) {
      try {
        const response = await fetch(`${API_BASE}/discount-schedules/${encodeURIComponent(family)}`, {
          method: "PUT", headers: authHeaders(), body: JSON.stringify({bands: discountSchedules[family] || []}),
        });
        if (!response.ok && ![404, 405, 501].includes(response.status)) throw new Error(`Discount save failed (${response.status})`);
      } catch (e) {
        alert(e.message);
      }
    }
    renderTotals();
  }

  function renderDiscountEditor() {
    const tbody = document.getElementById("discount-tier-rows");
    if (!tbody) return;
    const family = document.getElementById("discount-family").value;
    const factor = discountPeriod === "annual" ? 12 : 1;
    const rows = discountSchedules[family] || [];
    tbody.innerHTML = rows.map((row, index) => `
      <tr data-discount-index="${index}">
        <td><input data-discount-field="0" type="number" min="0" step="1" value="${Math.round(row[0] * factor)}"></td>
        <td><input data-discount-field="1" type="number" min="0" step="1" value="${row[1] >= 9_999_999_999 ? "" : Math.round(row[1] * factor)}" placeholder="No maximum"></td>
        <td><input data-discount-field="2" type="number" min="0" max="100" step="0.1" value="${(row[2] * 100).toFixed(1)}"></td>
        <td><input data-discount-field="3" type="number" min="0" max="100" step="0.1" value="${(row[3] * 100).toFixed(1)}"></td>
        <td><button data-delete-discount-tier>Delete</button></td>
      </tr>`).join("");
    tbody.querySelectorAll("[data-discount-field]").forEach(input => input.addEventListener("change", () => {
      const tr = input.closest("tr");
      const index = Number(tr.dataset.discountIndex);
      const field = Number(input.dataset.discountField);
      if (field <= 1) rows[index][field] = input.value === "" ? 9_999_999_999 : Number(input.value) / factor;
      else rows[index][field] = Math.max(0, Math.min(100, Number(input.value) || 0)) / 100;
      rows.sort((a, b) => a[0] - b[0]);
      saveDiscountSchedules(family);
      renderDiscountEditor();
    }));
    tbody.querySelectorAll("[data-delete-discount-tier]").forEach(btn => btn.addEventListener("click", () => {
      rows.splice(Number(btn.closest("tr").dataset.discountIndex), 1);
      saveDiscountSchedules(family);
      renderDiscountEditor();
    }));
  }

  // ---- persistence ----
  const STORAGE_KEY = "idcanopy-cockpit-current-v3";
  const SAVED_KEY = "idcanopy-cockpit-saved-v3";
  function saveAuto() {
    const state = {
      customer: document.getElementById("customer").value,
      term: document.getElementById("term").value,
      notes: document.getElementById("notes-area").value,
      annualApps,
      existingBase,
      scenario,
    };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function loadAuto() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const state = JSON.parse(raw);
      document.getElementById("customer").value = state.customer || "";
      document.getElementById("term").value = state.term === "PAYG" ? "PAYG" : "Prepaid";
      document.getElementById("notes-area").value = state.notes || "";
      annualApps = Number(state.annualApps) || 0;
      existingBase = Number(state.existingBase) || 0;
      document.getElementById("annual-apps").value = annualApps;
      document.getElementById("existing-base").value = existingBase;
      scenario = Array.isArray(state.scenario) ? state.scenario.filter(r => SKU_BY_ID[r.id] && !SKU_BY_ID[r.id].is_deleted).map(r => ({
        id: r.id,
        vol: Number(r.vol) || 0,
        share: Number(r.share) || (SKU_BY_ID[r.id]?.default_share_pct ?? 100),
        manual: r.manual === true,
      })) : [];
    } catch (e) {}
  }

  function saveScenarioByName() {
    const customer = document.getElementById("customer").value || "Untitled";
    const name = prompt("Save scenario as:", customer);
    if (!name) return;
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(SAVED_KEY) || "{}"); } catch (e) {}
    saved[name] = {
      customer: document.getElementById("customer").value,
      term: document.getElementById("term").value,
      notes: document.getElementById("notes-area").value,
      annualApps, existingBase, scenario,
      saved_at: new Date().toISOString(),
    };
    localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
    flashStatus(`Saved: ${name}`);

  function loadScenarioByName() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(SAVED_KEY) || "{}"); } catch (e) {}
    const names = Object.keys(saved);
    if (!names.length) { alert("No saved scenarios."); return; }
    const name = prompt("Load which scenario? Names:\n" + names.join("\n"), names[0]);
    if (!name || !saved[name]) return;
    const s = saved[name];
    document.getElementById("customer").value = s.customer || "";
    document.getElementById("term").value = s.term === "PAYG" ? "PAYG" : "Prepaid";
    document.getElementById("notes-area").value = s.notes || "";
    annualApps = Number(s.annualApps) || 0;
    existingBase = Number(s.existingBase) || 0;
    document.getElementById("annual-apps").value = annualApps;
    document.getElementById("existing-base").value = existingBase;
    scenario = Array.isArray(s.scenario) ? s.scenario.filter(r => SKU_BY_ID[r.id] && !SKU_BY_ID[r.id].is_deleted) : [];
    renderScenario();
    renderSuggestions();
    renderTotals();
  }

  function exportJson() {
    const state = {
      customer: document.getElementById("customer").value,
      term: document.getElementById("term").value,
      notes: document.getElementById("notes-area").value,
      annualApps, existingBase, scenario,
      exported_at: new Date().toISOString(),
    };
    const blob = new Blob([JSON.stringify(state, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `idcanopy-quote-${(state.customer || "untitled").replace(/[^a-z0-9]/gi, "-")}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function importJson(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const s = JSON.parse(e.target.result);
        document.getElementById("customer").value = s.customer || "";
        document.getElementById("term").value = s.term === "PAYG" ? "PAYG" : "Prepaid";
        document.getElementById("notes-area").value = s.notes || "";
        annualApps = Number(s.annualApps) || 0;
        existingBase = Number(s.existingBase) || 0;
        document.getElementById("annual-apps").value = annualApps;
        document.getElementById("existing-base").value = existingBase;
        scenario = Array.isArray(s.scenario) ? s.scenario.filter(r => SKU_BY_ID[r.id] && !SKU_BY_ID[r.id].is_deleted) : [];
        renderScenario();
        renderSuggestions();
        renderTotals();
        flashStatus("Imported.");
      } catch (err) { alert("Invalid JSON: " + err.message); }
    };
    reader.readAsText(file);
  }

  function copySummary() {
    let monthly = 0, oneTime = 0;
    const lines = [];
    const addendumLines = [];
    scenario.forEach(({id, vol}) => {
      const s = SKU_BY_ID[id];
      if (!s) return;
      // Dedicated-setup pseudo-SKUs or any SKU with a non-numeric price → addendum
      const ep = effectiveUnitPrice(s);
      const isAddendum = s.subcategory === "dedicated-setup" || typeof ep !== "number";
      if (isAddendum) {
        addendumLines.push(`• ${s.name}  — see respective tab`);
        return;
      }
      const r = computeRow(s, vol);
      monthly += r.monthly;
      oneTime += r.oneTime;
      const price = "€" + ep.toFixed(2) + " " + priceUnitSuffix(s.unit);
      const totalLine = (s.unit === "setup" || s.unit === "one-time" || s.unit === "project" || s.unit === "week")
        ? `one-time €${r.oneTime.toLocaleString("de-DE", {maximumFractionDigits: 0})}`
        : `€${r.monthly.toLocaleString("de-DE", {maximumFractionDigits: 0})}/mo`;
      lines.push(`• ${s.name}  ${price} × ${vol}  →  ${totalLine}`);
    });
    const term = document.getElementById("term").value;
    const discMo = discountedMonthlyForTerm(term);
    const eff = monthly > 0 ? 1 - (discMo / monthly) : 0;
    const annual = discMo * 12;
    const y1 = annual + oneTime;
    const customer = document.getElementById("customer").value || "(no customer)";
    const txtParts = [
      `IDCanopy quote — ${customer}`,
      `Term: ${term}`,
      `Annual applications: ${annualApps.toLocaleString("de-DE")} · Existing base: ${existingBase.toLocaleString("de-DE")}`,
      "",
      "Line items:",
      ...lines,
      "",
      `Monthly recurring: €${monthly.toLocaleString("de-DE",{maximumFractionDigits:0})}`,
      `Effective discount: ${(eff*100).toFixed(1)}%`,
      `Discounted monthly: €${discMo.toLocaleString("de-DE",{maximumFractionDigits:0})}`,
      `Annual recurring: €${annual.toLocaleString("de-DE",{maximumFractionDigits:0})}`,
      `One-time: €${oneTime.toLocaleString("de-DE",{maximumFractionDigits:0})}`,
      `Year 1 total: €${y1.toLocaleString("de-DE",{maximumFractionDigits:0})}`,
      `Year 2+ total: €${annual.toLocaleString("de-DE",{maximumFractionDigits:0})}`,
    ];
    if (addendumLines.length) {
      txtParts.push("");
      txtParts.push("Dedicated setup (priced separately):");
      txtParts.push(...addendumLines);
    }
    const txt = txtParts.join("\n");
    const notes = document.getElementById("notes-area").value;
    const final = notes ? txt + "\n\nNotes:\n" + notes : txt;
    navigator.clipboard.writeText(final).then(
      () => flashStatus("Copied summary to clipboard."),
      err => alert("Clipboard failed: " + err.message)
    );
  }

  async function loadV2Catalog() {
    if (isStaticReview()) return;
    try {
      const r = await fetch(V2_BASE + "/catalog", {headers: authHeaders()});
      if (!r.ok) return;
      const data = await r.json();
      v2State.source = data.source || "fallback";
      if (data.source === "normalized" && Array.isArray(data.skus)) {
        data.skus.forEach(function(ns) {
          const s = SKU_BY_ID[ns.sku_id];
          if (s) {
            s.counts_toward_tier = Boolean(ns.counts_toward_tier);
            s.discount_eligible = Boolean(ns.discount_eligible);
          }
        });
      }
    } catch(e) {}
