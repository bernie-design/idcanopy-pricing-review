  async function fetchV2State() {
    if (isStaticReview() || v2State.fetched) return;
    if (v2FetchPromise) return v2FetchPromise;
    v2FetchPromise = (async function() {
      try {
        const results = await Promise.all([
          fetch(V2_BASE + "/service-skus", {headers: authHeaders()}),
          fetch(V2_BASE + "/vendors", {headers: authHeaders()}),
          fetch(V2_BASE + "/variants", {headers: authHeaders()}),
          fetch(V2_BASE + "/purchase-schedules", {headers: authHeaders()}),
          fetch(V2_BASE + "/sell-schedules", {headers: authHeaders()}),
          fetch(V2_BASE + "/service-prices", {headers: authHeaders()}),
        ]);
        const [skuR, vendR, varR, schR, sellR, priceR] = results;
        if (skuR.ok) v2State.serviceSkus = (await skuR.json()).skus || [];
        if (vendR.ok) v2State.vendors = (await vendR.json()).vendors || [];
        if (varR.ok) v2State.variants = (await varR.json()).variants || [];
        if (schR.ok) v2State.purchaseSchedules = (await schR.json()).schedules || [];
        if (sellR.ok) v2State.sellSchedules = (await sellR.json()).schedules || [];
        if (priceR.ok) v2State.servicePrices = (await priceR.json()).prices || [];
        v2State.fetched = true;
      } catch(e) { v2FetchPromise = null; }
    })();
    return v2FetchPromise;
  }

    const bg = softMap[cls] || softMap.amber;

  async function saveV2Sku(row) {
    const skuId = row.dataset.v2Sku;
    if (!skuId) return;
    const current = v2State.serviceSkus.find(function(s) { return s.sku_id === skuId; });
    if (!current) return;
    const ctIn = row.querySelector('[data-v2-field="counts_toward_tier"]');
    const deIn = row.querySelector('[data-v2-field="discount_eligible"]');
    const payload = {
      family_slug: current.family_slug || '',
      name: current.name || skuId,
      description: current.description || '',
      occurrence_type: current.occurrence_type || 'transaction',
      category: current.category || '',
      surface: current.surface || 'general',
      counts_toward_tier: ctIn ? ctIn.checked : current.counts_toward_tier !== false,
      discount_eligible: deIn ? deIn.checked : current.discount_eligible !== false,
      status: current.status || 'active',
      metadata: current.metadata || {},
    };
    try {
      const r = await fetch(V2_BASE + '/service-skus/' + encodeURIComponent(skuId), {
        method: 'PUT', headers: authHeaders(), body: JSON.stringify(payload),
      });
      if (!r.ok) throw new Error('Save failed (' + r.status + ')');
      const updated = await r.json();
      const idx = v2State.serviceSkus.findIndex(function(s) { return s.sku_id === skuId; });
      if (idx >= 0) Object.assign(v2State.serviceSkus[idx], updated);
      const emb = SKU_BY_ID[skuId];
      if (emb) {
        emb.counts_toward_tier = payload.counts_toward_tier;
        emb.discount_eligible = payload.discount_eligible;
      }
      flashStatus('Saved ' + skuId);
    } catch(e) { alert(e.message); }
  }

    const draw = function(q) {

      });
      tbody.innerHTML = skus.map(function(s) {
        const emb = SKU_BY_ID[s.sku_id];
        const sp = priceBySkuId[s.sku_id];
        const listPrice = (sp && sp.unit_price != null) ? Number(sp.unit_price) : (emb ? emb.list_price : null);

        const lpPriceable = listPrice != null && isFinite(listPrice);

          marginHtml = v2Badge('⚠ no vendor cost', 'warning');

          marginHtml = v2Badge(margin.toFixed(1) + '%', margin < 15 ? 'warning' : 'active');
        }
        const lpTxt = lpPriceable ? ('€' + listPrice.toLocaleString('de-DE', {minimumFractionDigits:2,maximumFractionDigits:2})) : '<span style="color:var(--amber)">—</span>';
        const ptTxt = typeof ptCost === 'number' ? ('€' + Number(ptCost).toLocaleString('de-DE', {minimumFractionDigits:2,maximumFractionDigits:2})) : v2Badge('missing', 'missing');
        return '<tr>' +
          '<td><strong style="font-size:12px">' + escapeHtml(s.name) + '</strong><br><span style="color:var(--muted);font-size:11px">' + escapeHtml(s.sku_id) + '</span></td>' +
          '<td>' + escapeHtml(s.family_slug || '') + '</td>' +
          '<td>' + escapeHtml(s.occurrence_type || '') + '</td>' +
          '<td class="money">' + lpTxt + '</td>' +
          '<td class="money">' + ptTxt + '</td>' +
          '<td class="money">' + marginHtml + '</td>' +
          '<td>' + v2Badge(s.status || 'active', s.status || 'active') + '</td>' +
          '</tr>';
      }).join('');
      if (!skus.length) tbody.innerHTML = '<tr><td colspan="7" style="padding:24px;text-align:center;color:var(--muted)">No results</td></tr>';
    };
    document.getElementById('v2mc-search').addEventListener('input', function(e) { draw(e.target.value); });
    draw('');
  }

  // ---- Quote routing (v2) ----
  async function renderV2QuoteRouting() {
    const root = document.getElementById("quote-routing");
    if (!root || !DATA.internal) return;
    root.innerHTML = '';
    if (!scenario.length || isStaticReview()) return;
    if (!v2State.fetched) await fetchV2State();
    const variantsBySkuId = {};
    v2State.variants.forEach(function(v) {
      (variantsBySkuId[v.service_sku_id] = variantsBySkuId[v.service_sku_id] || []).push(v);
    });
    const routeLines = scenario.map(function(r) {
      const variants = variantsBySkuId[r.id];
      if (!variants || !variants.length) return null;
      const defaultV = variants.find(function(v) { return v.is_default; }) || variants[0];
      const selId = v2LineVariants[r.id] || defaultV.variant_id;
      return {id: r.id, name: (SKU_BY_ID[r.id] || {}).name || r.id, variants: variants, selectedId: selId};
    }).filter(Boolean);
    if (!routeLines.length) return;
    let html = '<div style="margin-top:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px">';
    html += '<div style="font-weight:600;font-size:13px;margin-bottom:8px">Vendor routing (v2)</div>';
    routeLines.forEach(function(l) {
      const opts = l.variants.map(function(v) {
        return '<option value="' + escapeHtml(v.variant_id) + '"' + (v.variant_id === l.selectedId ? ' selected' : '') + '>' + escapeHtml(v.name || v.vendor_sku_code || v.variant_id) + '</option>';
      }).join('');
      html += '<div style="display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px" data-route-line="' + escapeHtml(l.id) + '">';
      html += '<span>' + escapeHtml(l.name) + '</span>';
      html += '<select data-route-variant="' + escapeHtml(l.id) + '">' + opts + '</select>';
      html += '</div>';
    });
    html += '<div style="margin-top:10px;display:flex;gap:8px;align-items:center">';
    html += '<button class="btn" id="v2-resolve-btn">Resolve pricing via API</button>';
    html += '<span id="v2-resolve-status" style="font-size:12px;color:var(--muted)"></span>';
    html += '</div><div id="v2-resolve-result"></div></div>';
    root.innerHTML = html;
    root.querySelectorAll('[data-route-variant]').forEach(function(sel) {
      sel.addEventListener('change', function(e) {
        v2LineVariants[e.target.dataset.routeVariant] = e.target.value;
      });
    });
    const resolveBtn = document.getElementById('v2-resolve-btn');
    if (resolveBtn) resolveBtn.addEventListener('click', resolveV2Quote);
  }

  async function resolveV2Quote() {
    const btn = document.getElementById('v2-resolve-btn');
    const statusEl = document.getElementById('v2-resolve-status');
    const resultDiv = document.getElementById('v2-resolve-result');
    if (!btn) return;
    btn.disabled = true;
    if (statusEl) statusEl.textContent = 'Resolving…';
    if (resultDiv) resultDiv.innerHTML = '';
    const term = document.getElementById('term').value;
    const model = term === 'PAYG' ? 'payg' : 'annual_prepaid';
    const d = new Date();
    const todayIso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const lines = scenario.map(function(r) {
      return {
        service_sku_id: r.id,
        quantity: String(Number(r.vol) || 1),
        commercial_model: model,
        vendor_variant_id: v2LineVariants[r.id] || null,
      };
    });
    try {
      const resp = await fetch(V2_BASE + '/quote/resolve', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({lines: lines, effective_date: todayIso}),
      });
      if (resp.status === 501) {
        if (resultDiv) resultDiv.innerHTML = '<div style="margin-top:8px;padding:8px 10px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:6px;font-size:12px">Engine not yet wired — returns 501 until Indigo 2 (Engine) merges.</div>';
      } else if (!resp.ok) {
        throw new Error(resp.status + ' ' + resp.statusText);
      } else {
        const result = await resp.json();
        v2QuoteResolved = result;
        const warns = (result.warnings || []);
        let resHtml = '<div style="margin-top:8px;padding:8px 10px;background:var(--green-soft);border:1px solid var(--green);border-radius:6px;font-size:12px">';
        resHtml += '<strong>Resolved ' + (result.lines || []).length + ' line(s)</strong>';
        if (warns.length) resHtml += '<br><span style="color:var(--amber)">⚠ ' + escapeHtml(warns.join('; ')) + '</span>';
        resHtml += '</div>';
        if ((result.lines || []).length) {
          resHtml += '<table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:12px">' +
            '<thead><tr>' +
            '<th style="text-align:left;padding:3px 6px;border-bottom:1px solid var(--border)">SKU</th>' +
            '<th style="text-align:right;padding:3px 6px;border-bottom:1px solid var(--border)">Unit price</th>' +
            '<th style="text-align:right;padding:3px 6px;border-bottom:1px solid var(--border)">Line total</th>' +
            '<th style="text-align:left;padding:3px 6px;border-bottom:1px solid var(--border)">Notes</th>' +
            '</tr></thead><tbody>';
          (result.lines || []).forEach(function(l) {
            const cpNum = (l.customer_price != null) ? Number(l.customer_price) : null;
            const ltNum = (l.line_total != null) ? Number(l.line_total) : null;
            const cpTxt = (cpNum != null && isFinite(cpNum))
              ? ('€' + cpNum.toLocaleString('de-DE', {minimumFractionDigits:2,maximumFractionDigits:2}))
              : '<span style="color:var(--amber)">— unpriceable</span>';
            const ltTxt = (ltNum != null && isFinite(ltNum))
              ? ('€' + ltNum.toLocaleString('de-DE', {minimumFractionDigits:2,maximumFractionDigits:2}))
              : '<span style="color:var(--amber)">—</span>';
            const lw = (l.warnings || []);
            resHtml += '<tr>' +
              '<td style="padding:3px 6px;font-size:11px;color:var(--muted)">' + escapeHtml(l.service_sku_id) + '</td>' +
              '<td style="padding:3px 6px;text-align:right">' + cpTxt + '</td>' +
              '<td style="padding:3px 6px;text-align:right">' + ltTxt + '</td>' +
              '<td style="padding:3px 6px;font-size:11px;color:var(--amber)">' + (lw.length ? '⚠ ' + escapeHtml(lw.join('; ')) : '') + '</td>' +
              '</tr>';
          });
          resHtml += '</tbody></table>';
        }
        if (resultDiv) resultDiv.innerHTML = resHtml;
      }
      if (statusEl) statusEl.textContent = '';
    } catch(e) {
      if (resultDiv) resultDiv.innerHTML = '<div style="margin-top:8px;padding:8px 10px;background:var(--red-soft);border:1px solid var(--red);border-radius:6px;font-size:12px">Error: ' + escapeHtml(e.message) + '</div>';
      if (statusEl) statusEl.textContent = '';
    }
    btn.disabled = false;
  }

  // Applied-tier hint in the quote builder — internal only (Indigo 7)
  const _baseRenderTotals = renderTotals;
  renderTotals = function() {
    _baseRenderTotals();
    const root = document.getElementById("totals");
    if (!root) return;
    const famConsumption = {};
    scenario.forEach(({id, vol}) => {
      const s = SKU_BY_ID[id];
      if (!s || s.discount_eligible === false) return;
      const m = computeRow(s, vol).monthly;
      const fam = s.discount_family || "umbrella";
      famConsumption[fam] = (famConsumption[fam] || 0) + m;
    });
    const entries = Object.entries(famConsumption);
    if (!entries.length) return;
    const term = document.getElementById("term").value;
    const FAMILY_LABELS = {"umbrella":"Umbrella","eid-esigning":"eID / eSigning","account-origination":"Account Origination","aletheia":"Aletheia"};
    const lines = entries.map(([fam, vol]) => {
      const band = lookupBand(fam, vol);
      const disc = effectiveDiscount(term, band.payg, band.prep);
      const label = FAMILY_LABELS[fam] || fam;
      return disc > 0
        ? `<span style="margin-right:12px">${escapeHtml(label)}: ${(disc*100).toFixed(1)}% applied @ ${eur(vol, 0)}/mo tier</span>`
        : `<span style="margin-right:12px">${escapeHtml(label)}: 0% (below first tier)</span>`;
    }).join("");
    const hint = document.createElement("div");
    hint.setAttribute("data-discount-hint", "");
    hint.style.cssText = "font-size:11px; color:var(--muted); margin: 6px 0 2px; padding: 6px 0; border-top: 1px solid var(--border);";
    hint.innerHTML = "Applied discount tiers: " + lines;
    const cmpTable = root.querySelector("#compare-table");
    if (cmpTable && cmpTable.previousElementSibling) root.insertBefore(hint, cmpTable.previousElementSibling);
    else root.appendChild(hint);
  };

  // ---- wire up ----
  document.getElementById("search").addEventListener("input", e => renderCategories(e.target.value));
  document.getElementById("term").addEventListener("change", renderTotals);
  document.getElementById("customer").addEventListener("input", saveAuto);
  document.getElementById("notes-area").addEventListener("input", saveAuto);
  document.getElementById("annual-apps").addEventListener("input", e => setAnnualApps(e.target.value));
  document.getElementById("existing-base").addEventListener("input", e => setExistingBase(e.target.value));
  document.getElementById("reset-shares-btn").addEventListener("click", resetSharesToDefaults);
  document.getElementById("clear-btn").addEventListener("click", clearAll);
  document.getElementById("copy-btn").addEventListener("click", copySummary);
  document.getElementById("print-btn").addEventListener("click", () => window.print());
  document.getElementById("save-btn").addEventListener("click", saveScenarioByName);
  document.getElementById("load-btn").addEventListener("click", loadScenarioByName);
  document.getElementById("export-btn").addEventListener("click", exportJson);
  document.getElementById("import-btn").addEventListener("click", () => document.getElementById("import-file").click());
  document.getElementById("import-file").addEventListener("change", e => {
    if (e.target.files[0]) importJson(e.target.files[0]);
    e.target.value = "";
  });
  const priceModeBtn = document.getElementById("price-mode-btn");
  const resellerDiscountInput = document.getElementById("reseller-discount");
  if (priceModeBtn) priceModeBtn.addEventListener("click", () => {
    resellerBuyMode = !resellerBuyMode;
    document.body.classList.toggle("reseller-buy", resellerBuyMode);
    priceModeBtn.classList.toggle("buy-active", resellerBuyMode);
    priceModeBtn.textContent = resellerBuyMode ? "Show customer prices" : "Show reseller buy prices";
    renderCategories(document.getElementById("search").value);
    renderScenario();
    renderTotals();
    renderAllCatalogViews();
  });
  if (resellerDiscountInput) resellerDiscountInput.addEventListener("input", e => {
    resellerDiscountPct = Math.max(0, Math.min(100, Number(e.target.value) || 0));
    if (resellerBuyMode) {
      renderCategories(document.getElementById("search").value);
      renderScenario();
      renderTotals();
      renderAllCatalogViews();
    }
  });
  document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => setView(tab.dataset.view)));
  document.querySelectorAll("[data-collapse]").forEach(band => band.addEventListener("click", () => {
    const content = document.getElementById(band.dataset.collapse);
    content.classList.toggle("collapsed");
    band.classList.toggle("expanded", !content.classList.contains("collapsed"));
  }));
  const quoteDrawer = document.getElementById("quote-drawer");
  document.getElementById("quote-fab").addEventListener("click", () => quoteDrawer.classList.add("open"));
  document.getElementById("quote-drawer-close").addEventListener("click", () => quoteDrawer.classList.remove("open"));
  async function init() {
    if (DATA.reseller) document.body.classList.add("reseller");
    if (!DATA.internal) document.querySelectorAll(".internal-only").forEach(el => el.remove());
    if (DATA.internal) await loadV2Catalog();
    if (DATA.internal) await loadOverrides();
    await loadDiscountSchedules();
    loadAuto();
    renderCategories();
    renderBundles();
    renderScenario();
    renderSuggestions();
    renderTotals();
    renderAllCatalogViews();
    renderDiscountEditor();
    (function() {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
      btn.addEventListener('click', function() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', dark ? '' : 'dark');
        localStorage.setItem('idcanopy-theme', dark ? 'light' : 'dark');
        btn.textContent = dark ? '🌙' : '☀️';
      });
    })();
  }
  init();
})();
</script>
</body>
